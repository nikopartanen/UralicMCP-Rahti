pid /tmp/nginx.pid;
worker_processes 1;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;

        location = / {
            root /app/static;
            index index.html;
        }

        location /mcp {
            # CORS preflight: answered directly by nginx
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "https://llm-service.apps.ocp-bm-0.k8s.it.helsinki.fi" always;
                add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Accept, Mcp-Session-Id, Mcp-Protocol-Version, Last-Event-ID, Authorization" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            # CORS headers on real responses
            add_header Access-Control-Allow-Origin   "https://llm-service.apps.ocp-bm-0.k8s.it.helsinki.fi" always;
            add_header Access-Control-Expose-Headers "Mcp-Session-Id" always;

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host localhost:8000;
            proxy_set_header Origin "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
